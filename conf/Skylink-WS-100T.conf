# 002A109 REV A2 on my remote's PCB next to battery terminals
# IC:4454A-WS100R labeled on its receiver (Skylink WS-100R)
# Emission designation 703KF2X, channelized? between 304.8 309.8 314.1 MHz per https://fccid.io/KUTWS100T/Test-Report/October-4-revised-test-report-173042
# "Red dot" (stickers) on both T & R mean the channel? tested seems to be ~305M, amplitude peaks here only when battery in/button pushed?
# Failed to profile with either ./rtl433 -d driver=sdrplay -R 0 -f 305M -A (RSP1) or ./rtl_433 -R 0 -f 305M -A (NESDR SMArTee v2) & >20 garbage test iterations from Gemini & ChatGPT.
# Would have tested with ./rtl433 -d driver=sdrplay -c Skylink-WS-100T.conf & ./rtl_433 -c Skylink-WS-100T.conf after rtl_433's suggested -X 'n=SKYLINK_WS100T,m= etc., temporary decoder arguments would have confirmed the profile worked.
# Placeholder values below are from Etekcity-ZAP-3F.conf

decoder {
        n=Skylink-WS-100T,
        m=OOK_PWM,
        s=156,
        l=508,
        g=568,
        r=5508,
        bits=25,
        repeats>=3,
        invert,
        get=@0:{16}:id,
        get=@16:{8}:button:[51:1-ON 60:1-OFF 195:2-ON 204:2-OFF 3:3-ON 12:3-OFF],
        unique
}
